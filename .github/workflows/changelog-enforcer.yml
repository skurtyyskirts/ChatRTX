name: Changelog Check

on:
  pull_request:
    branches: [main]

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CHANGELOG updated
        run: |
          if git diff --name-only origin/main...HEAD | grep -qiE 'CHANGELOG|CHANGES'; then
            echo "Changelog updated — good."
          else
            echo "::warning::No changelog updated in this PR. Consider documenting your changes."
          fi
