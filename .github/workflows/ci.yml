name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["release/**", "main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 ChatRTX_APIs/ChatRTX --config=setup.cfg

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: pip install -r ChatRTX_APIs/tests/requirements-test.txt

      - name: Run tests
        run: |
          pytest ChatRTX_APIs/tests \
            --cov=ChatRTX_APIs/ChatRTX \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
