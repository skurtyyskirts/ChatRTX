[flake8]
max-line-length = 120
# Only enforce pyflakes error checks (F-codes) and a small set of critical
# style rules on new code.  Pre-existing E/W style violations in the NVIDIA
# source are suppressed so the CI gate remains actionable.
select = F,E9
per-file-ignores =
    # examples use names injected at runtime (e.g. logger from calling scope)
    ChatRTX_APIs/ChatRTX/examples/*.py:F821
    # load_audio is provided by the openai-whisper package at runtime
    ChatRTX_APIs/ChatRTX/inference/trtllm/whisper/whisper_utils.py:F821
exclude =
    .git,
    __pycache__,
    dist,
    build,
    *.egg-info,
    ChatRTX_APIs/ChatRTX/config,
    ChatRTX_APIs/ChatRTX/sample_data

[tool:pytest]
testpaths = ChatRTX_APIs/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
